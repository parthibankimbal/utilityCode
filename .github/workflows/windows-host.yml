name: Build and Notify

on: 
  push:  # This will trigger the workflow on any branch

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Print Message
        run: echo "I'm running on GitHub self-hosted Windows host"

      - name: Get Timestamp
        shell: powershell
        run: |
          $timestamp = (Get-Date).ToString('yyyyMMdd_HHmm')
          Add-Content -Path $env:GITHUB_ENV -Value "timestamp=$timestamp"

      - name: Delete coreKushal folder if exists
        run: |
          if (Test-Path 'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal') {
            Remove-Item 'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal' -Recurse -Force
          }
        shell: powershell

      - name: Clone coreKushal Repository
        run: |
          cd 'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow'
          git clone https://github.com/parthibankimbal/coreKushal.git

      - name: Add commonCode Subtree
        run: |
          cd 'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal'
          git subtree add --prefix=rl78i1c https://github.com/parthibankimbal/commonCode.git main --squash
          git subtree add --prefix=rl78i1c/application https://github.com/parthibankimbal/utilityCode.git ${{ github.ref_name }}

      - name: Run the build script
        run: |
          cd 'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal\make'
          .\build.bat

      - name: Extract Utility Name and Create ZIP file
        shell: powershell
        run: |
          $utilityInfoFile = 'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal\rl78i1c\application\utilityinfo'
          $utilityName = (Select-String -Path $utilityInfoFile -Pattern "^Utility name: (.*)$").Matches[0].Groups[1].Value
          if (-not $utilityName) { Write-Error "Utility name not found in utilityinfo file" }
          $timestamp = (Get-Date).ToString('yyyyMMdd_HHmm')
          $zipFileName = "${utilityName}_kushal1p_$timestamp.zip"
          $zipFilePath = "C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\$zipFileName"
          Add-Content -Path $env:GITHUB_ENV -Value "zipFileName=$zipFileName"
          Add-Content -Path $env:GITHUB_ENV -Value "utilityName=$utilityName"
          Compress-Archive -Path `
            'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal\00Build\CS+_CCRL\ImageBuilder\Config.rpj', `
            'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal\00Build\CS+_CCRL\ImageBuilder\Newtonsoft.Json.dll', `
            'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal\00Build\CS+_CCRL\ImageBuilder\Newtonsoft.Json.xml', `
            'C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\coreKushal\00Build\CS+_CCRL\ImageBuilder\UMD_ImageBuilder.exe' `
          -DestinationPath $zipFilePath
          Write-Host "ZIP file created: $zipFilePath"

      - name: Upload ZIP to Nexus Repository
        run: |
          curl.exe -v --user "kushal-meter-write:Kimbal@321" --upload-file "C:\Users\ParthibanEthiraj\OneDrive - Sinhal Udyog pvt ltd\Downloads\WorkFlow\${{ env.zipFileName }}" https://repo.kimbal.io/repository/kushal-meter-raw/${{ env.zipFileName }}
        shell: bash

      - name: Send Email Notification
        shell: powershell
        run: |
          $smtpServer = "smtp.office365.com"
          $smtpFrom = "kushalnotifications@kimbal.io"
          $smtpTo = "parthiban.ethiraj@kimbal.io"
          $subject = "Build Notification - Utility: ${{ env.utilityName }}"
          $body = "The build for Utility ${{ env.utilityName }} has completed. The ZIP file can be downloaded from: https://repo.kimbal.io/repository/kushal-meter-raw/${{ env.zipFileName }}"
          $password = ConvertTo-SecureString "Duw31423" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("kushalnotifications@kimbal.io", $password)
          Send-MailMessage -From $smtpFrom -To $smtpTo -Subject $subject -Body $body -SmtpServer $smtpServer -Credential $cred -UseSsl -Port 587
