name: Self-hosted Windows Runner

on: [push]

jobs:
  run-on-self-hosted-windows:
    runs-on: self-hosted
    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Print Message
        run: echo "I'm running on GitHub self-hosted Windows host"

      # Get the current timestamp using Windows PowerShell
      - name: Get Timestamp
        shell: powershell
        run: |
          $timestamp = (Get-Date).ToString('yyyyMMddHHmmss')
          Add-Content -Path $env:GITHUB_ENV -Value "timestamp=$timestamp"

      # Create folder and copy utilityinfo file
      - name: Create WB_<timestamp> folder and copy utilityinfo
        run: |
          mkdir WB_${{ env.timestamp }}
          copy utilityinfo WB_${{ env.timestamp }}\

      # Upload WB_<timestamp> folder as an artifact
      - name: Upload WB_<timestamp> as an artifact
        uses: actions/upload-artifact@v3
        with:
          name: WB_${{ env.timestamp }}
          path: WB_${{ env.timestamp }}
